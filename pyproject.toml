[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "poker-engine"
version = "0.2.0"
description = "Python ranges and a Rust equity engine for Hold'em, Omaha and WebAssembly"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND ISC"
license-files = ["LICENSE", "THIRD_PARTY.md", "cpp/vendor/ompeval/LICENSE.txt", "cpp/vendor/ompeval/NOTICE.md"]

[project.scripts]
poker-engine = "poker_engine.cli:main"

[project.optional-dependencies]
notebook = ["pandas>=2"]

[tool.maturin]
features = ["python"]
python-source = "."
module-name = "poker_engine._native"
strip = true
exclude = [{ path = "poker_engine/data/*.gz", format = "wheel" },
           { path = "web/pkg/**/*", format = "sdist" },
           "**/__pycache__/**"]
include = [{ path = "data/core.bin.gz", format = "sdist" },
           { path = "poker_engine/data/omaha.bin.gz", format = "sdist" },
           { path = "cpp/**/*", format = "sdist" },
           { path = "tools/**/*", format = "sdist" },
           { path = "docs/**/*", format = "sdist" },
           { path = "examples/**/*", format = "sdist" },
           { path = "web/**/*", format = "sdist" },
           { path = "tests/**/*", format = "sdist" },
           { path = "benchmarks/**/*", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
