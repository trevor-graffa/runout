[package]
name = "poker-engine"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT AND ISC"
description = "Numeric Hold'em and Omaha equity core for Python and WebAssembly"

[lib]
name = "_native"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen"]

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
pyo3 = { version = "0.29", optional = true, features = ["abi3-py310"] }
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
